<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 930" role="img" aria-labelledby="title desc">
  <title id="title">Vergleich von Datenentstehung, Transfer und Tests</title>
  <desc id="desc">Grafische Gegenüberstellung der erzeugten Testdaten, der Transferpipeline und der 36 erfolgreichen Tests. Die Grafik zeigt außerdem die Grenze: reale Kamera-zu-Kamera-Tests mit zwei Geräten sind noch nicht abgedeckt.</desc>
  <style>
    .bg { fill: #fffafc; }
    .title { fill: #30252d; font: 600 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .subtitle, .axis, .label, .legend, .note { fill: #6f626b; font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .label { fill: #30252d; font-weight: 500; }
    .strong { fill: #30252d; font-weight: 600; }
    .grid { stroke: #eadfe5; stroke-width: 1; }
    .arrow { stroke: #8d7b86; stroke-width: 2; marker-end: url(#arrowhead); }
    .data { fill: #f4dce7; stroke: #e5c2d1; stroke-width: 1; }
    .transfer { fill: #eee2f5; stroke: #d9c3e8; stroke-width: 1; }
    .tested { fill: #e0f0e5; stroke: #bedcc6; stroke-width: 1; }
    .gap { fill: #f8d9df; stroke: #e9abb7; stroke-width: 1; }
    .ok { fill: #39734a; font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .warn { fill: #a43e55; font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .bar-bg { fill: #f1e8ed; }
    .bar { fill: #c24f7b; }
    .value { fill: #30252d; font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .summary { fill: #f8edf3; }
    .summary-value { fill: #30252d; font: 600 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .summary-label { fill: #6f626b; font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8d7b86"/>
    </marker>
  </defs>

  <rect class="bg" width="1400" height="930" rx="18"/>
  <text class="title" x="42" y="48">Datenentstehung, Transfer und Testvergleich</text>
  <text class="subtitle" x="42" y="75">Was wird erzeugt? Was wird übertragen? Was wurde im Projekt bereits geprüft?</text>

  <rect class="summary" x="42" y="98" width="1316" height="62" rx="12"/>
  <text class="summary-value" x="72" y="127">36 / 36 Tests bestanden</text>
  <text class="summary-label" x="72" y="148">Relevante Transfer-, MLQR- und UI-Tests</text>
  <text class="summary-value" x="430" y="127">365 Tage</text>
  <text class="summary-label" x="430" y="148">Jahresdaten im digitalen Transfer-Test</text>
  <text class="summary-value" x="760" y="127">1–15 Layer</text>
  <text class="summary-label" x="760" y="148">MLQR-Abdeckung im Decoder</text>
  <text class="summary-value" x="1080" y="127">0 echte Geräte</text>
  <text class="summary-label" x="1080" y="148">Noch kein iPhone↔Samsung-Nachweis</text>

  <text class="strong" x="55" y="202">1. Vergleich entlang der Datenentstehung</text>
  <text class="axis" x="55" y="229">Datenquelle</text>
  <text class="axis" x="55" y="311">Transfer</text>
  <text class="axis" x="55" y="393">Testnachweis</text>

  <rect class="data" x="150" y="213" width="230" height="52" rx="10"/>
  <rect class="data" x="430" y="213" width="230" height="52" rx="10"/>
  <rect class="data" x="710" y="213" width="230" height="52" rx="10"/>
  <rect class="data" x="990" y="213" width="230" height="52" rx="10"/>
  <text class="label" x="265" y="236" text-anchor="middle">Snapshot</text><text class="legend" x="265" y="254" text-anchor="middle">Tagesdaten, Perioden, Notizen</text>
  <text class="label" x="545" y="236" text-anchor="middle">Jahresdaten</text><text class="legend" x="545" y="254" text-anchor="middle">365 Tage, repetitive Werte</text>
  <text class="label" x="825" y="236" text-anchor="middle">QR-Pakete</text><text class="legend" x="825" y="254" text-anchor="middle">1–15 optische Layer</text>
  <text class="label" x="1105" y="236" text-anchor="middle">Testvarianten</text><text class="legend" x="1105" y="254" text-anchor="middle">korrekt, beschädigt, unvollständig</text>
  <line class="arrow" x1="380" y1="239" x2="428" y2="239"/><line class="arrow" x1="660" y1="239" x2="708" y2="239"/><line class="arrow" x1="940" y1="239" x2="988" y2="239"/>

  <rect class="transfer" x="150" y="295" width="230" height="52" rx="10"/>
  <rect class="transfer" x="430" y="295" width="230" height="52" rx="10"/>
  <rect class="transfer" x="710" y="295" width="230" height="52" rx="10"/>
  <rect class="transfer" x="990" y="295" width="230" height="52" rx="10"/>
  <text class="label" x="265" y="318" text-anchor="middle">CBOR + GZIP</text><text class="legend" x="265" y="336" text-anchor="middle">serialisieren und komprimieren</text>
  <text class="label" x="545" y="318" text-anchor="middle">Chunks</text><text class="legend" x="545" y="336" text-anchor="middle">Index, Total, Transfer-ID</text>
  <text class="label" x="825" y="318" text-anchor="middle">MLQR / QR</text><text class="legend" x="825" y="336" text-anchor="middle">digital und synthetische Kamera</text>
  <text class="label" x="1105" y="318" text-anchor="middle">Empfang</text><text class="legend" x="1105" y="336" text-anchor="middle">sammeln, prüfen, speichern</text>
  <line class="arrow" x1="380" y1="321" x2="428" y2="321"/><line class="arrow" x1="660" y1="321" x2="708" y2="321"/><line class="arrow" x1="940" y1="321" x2="988" y2="321"/>

  <rect class="tested" x="150" y="377" width="230" height="52" rx="10"/>
  <rect class="tested" x="430" y="377" width="230" height="52" rx="10"/>
  <rect class="tested" x="710" y="377" width="230" height="52" rx="10"/>
  <rect class="tested" x="990" y="377" width="230" height="52" rx="10"/>
  <text class="ok" x="265" y="400" text-anchor="middle">Codec-Tests</text><text class="legend" x="265" y="418" text-anchor="middle">Roundtrip + Verschlüsselung</text>
  <text class="ok" x="545" y="400" text-anchor="middle">Chunk-Tests</text><text class="legend" x="545" y="418" text-anchor="middle">Reihenfolge + Duplikate</text>
  <text class="ok" x="825" y="400" text-anchor="middle">Decoder-Tests</text><text class="legend" x="825" y="418" text-anchor="middle">1–15 Layer + Kamera-Simulation</text>
  <text class="ok" x="1105" y="400" text-anchor="middle">UI-/Integrationstests</text><text class="legend" x="1105" y="418" text-anchor="middle">Senden, Empfangen, Ergebnis</text>
  <line class="arrow" x1="265" y1="265" x2="265" y2="293"/><line class="arrow" x1="545" y1="265" x2="545" y2="293"/><line class="arrow" x1="825" y1="265" x2="825" y2="293"/><line class="arrow" x1="1105" y1="265" x2="1105" y2="293"/>
  <line class="arrow" x1="265" y1="347" x2="265" y2="375"/><line class="arrow" x1="545" y1="347" x2="545" y2="375"/><line class="arrow" x1="825" y1="347" x2="825" y2="375"/><line class="arrow" x1="1105" y1="347" x2="1105" y2="375"/>

  <text class="strong" x="55" y="480">2. Tatsächliche Testverteilung</text>
  <text class="axis" x="55" y="509">Testdatei / geprüfter Bereich</text>
  <text class="axis" x="1185" y="509" text-anchor="end">Bestanden</text>
  <line class="grid" x1="55" y1="520" x2="1220" y2="520"/>
  <text class="label" x="55" y="549">transfer_codec_test.dart</text><rect class="bar-bg" x="360" y="536" width="680" height="18" rx="9"/><rect class="bar" x="360" y="536" width="680" height="18" rx="9"/><text class="value" x="1060" y="550">8 / 8</text>
  <text class="label" x="55" y="583">mlqr_decoder_test.dart</text><rect class="bar-bg" x="360" y="570" width="680" height="18" rx="9"/><rect class="bar" x="360" y="570" width="680" height="18" rx="9"/><text class="value" x="1060" y="584">7 / 7</text>
  <text class="label" x="55" y="617">mlqr_transfer_test.dart</text><rect class="bar-bg" x="360" y="604" width="680" height="18" rx="9"/><rect class="bar" x="360" y="604" width="680" height="18" rx="9"/><text class="value" x="1060" y="618">5 / 5</text>
  <text class="label" x="55" y="651">transfer_receive_test.dart</text><rect class="bar-bg" x="360" y="638" width="680" height="18" rx="9"/><rect class="bar" x="360" y="638" width="680" height="18" rx="9"/><text class="value" x="1060" y="652">8 / 8</text>
  <text class="label" x="55" y="685">transfer_send_test.dart</text><rect class="bar-bg" x="360" y="672" width="680" height="18" rx="9"/><rect class="bar" x="360" y="672" width="680" height="18" rx="9"/><text class="value" x="1060" y="686">3 / 3</text>
  <text class="label" x="55" y="719">transfer_result_test.dart</text><rect class="bar-bg" x="360" y="706" width="680" height="18" rx="9"/><rect class="bar" x="360" y="706" width="680" height="18" rx="9"/><text class="value" x="1060" y="720">4 / 4</text>
  <text class="label" x="55" y="753">repository_integration_test.dart</text><rect class="bar-bg" x="360" y="740" width="680" height="18" rx="9"/><rect class="bar" x="360" y="740" width="680" height="18" rx="9"/><text class="value" x="1060" y="754">1 / 1</text>
  <text class="strong" x="1120" y="650">36 / 36</text><text class="legend" x="1120" y="671">alle grün</text>

  <text class="strong" x="55" y="810">3. Vergleichswert: Was fehlt noch?</text>
  <rect class="gap" x="55" y="830" width="570" height="55" rx="10"/>
  <rect class="gap" x="650" y="830" width="570" height="55" rx="10"/>
  <text class="warn" x="75" y="853">Nicht abgedeckt: echte Gerätekamera</text>
  <text class="legend" x="75" y="873">Display → reale Kamera → reales Licht → anderes Gerät</text>
  <text class="warn" x="670" y="853">Nicht abgedeckt: fertiger verschlüsselter UI-Fluss</text>
  <text class="legend" x="670" y="873">Passphrase-Eingabe und End-to-End-Import im Produktpfad</text>
  <text class="note" x="55" y="910">Interpretation: Die digitale Datenlogik ist durch Tests gut abgesichert. Der Vergleichswert für die offene Arbeit ist die reale optische Übertragung zwischen zwei Geräten.</text>
</svg>
