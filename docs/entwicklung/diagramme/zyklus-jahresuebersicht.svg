<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Zyklus-Jahresübersicht der Demo-Daten</title>
  <desc id="desc">Horizontale Zeitachse von November 2025 bis Oktober 2026 mit zwölf Zyklen. Pinke Segmente markieren Blutungstage, kleine violette Marker Schmierblutungen.</desc>
  <style>
    .bg { fill: #fffafc; }
    .title { fill: #30252d; font: 600 26px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .subtitle, .axis, .label, .legend, .note { fill: #6f626b; font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .label { fill: #30252d; font-weight: 500; }
    .value { fill: #30252d; font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .month-line { stroke: #eadfe5; stroke-width: 1; }
    .row-line { stroke: #f0e8ed; stroke-width: 1; }
    .cycle { fill: #f4dce7; }
    .period { fill: #d8648d; }
    .spotting { fill: #8565a8; }
    .summary { fill: #f8edf3; }
    .summary-value { fill: #30252d; font: 600 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .summary-label { fill: #6f626b; font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  </style>

  <rect class="bg" width="1200" height="650" rx="18"/>
  <text class="title" x="42" y="48">Zyklusübersicht · Demo-Jahr</text>
  <text class="subtitle" x="42" y="73">04.11.2025–28.10.2026 · 12 vollständige Zyklen</text>

  <rect class="summary" x="42" y="98" width="1116" height="70" rx="12"/>
  <text class="summary-value" x="72" y="128">28,25 Tage</text>
  <text class="summary-label" x="72" y="150">Durchschnittliche Zykluslänge</text>
  <text class="summary-value" x="350" y="128">26–31 Tage</text>
  <text class="summary-label" x="350" y="150">Kürzester bis längster Zyklus</text>
  <text class="summary-value" x="650" y="128">4–6 Tage</text>
  <text class="summary-label" x="650" y="150">Erfasste Blutungsdauer</text>
  <text class="summary-value" x="900" y="128">3 Marker</text>
  <text class="summary-label" x="900" y="150">Schmierblutungen</text>

  <text class="axis" x="42" y="204">Zeitraum</text>
  <text class="axis" x="1110" y="204" text-anchor="end">Tag 365</text>

  <g aria-label="Monatsachse">
    <line class="month-line" x1="120" y1="214" x2="120" y2="535"/>
    <line class="month-line" x1="207" y1="214" x2="207" y2="535"/>
    <line class="month-line" x1="292" y1="214" x2="292" y2="535"/>
    <line class="month-line" x1="378" y1="214" x2="378" y2="535"/>
    <line class="month-line" x1="463" y1="214" x2="463" y2="535"/>
    <line class="month-line" x1="548" y1="214" x2="548" y2="535"/>
    <line class="month-line" x1="634" y1="214" x2="634" y2="535"/>
    <line class="month-line" x1="719" y1="214" x2="719" y2="535"/>
    <line class="month-line" x1="805" y1="214" x2="805" y2="535"/>
    <line class="month-line" x1="890" y1="214" x2="890" y2="535"/>
    <line class="month-line" x1="975" y1="214" x2="975" y2="535"/>
    <line class="month-line" x1="1061" y1="214" x2="1061" y2="535"/>
    <line class="month-line" x1="1146" y1="214" x2="1146" y2="535"/>
    <text class="axis" x="120" y="232">Nov 25</text>
    <text class="axis" x="207" y="232">Dez</text>
    <text class="axis" x="292" y="232">Jan 26</text>
    <text class="axis" x="378" y="232">Feb</text>
    <text class="axis" x="463" y="232">Mär</text>
    <text class="axis" x="548" y="232">Apr</text>
    <text class="axis" x="634" y="232">Mai</text>
    <text class="axis" x="719" y="232">Jun</text>
    <text class="axis" x="805" y="232">Jul</text>
    <text class="axis" x="890" y="232">Aug</text>
    <text class="axis" x="975" y="232">Sep</text>
    <text class="axis" x="1061" y="232">Okt</text>
  </g>

  <g aria-label="Zyklusverläufe">
    <line class="row-line" x1="42" y1="250" x2="1146" y2="250"/>
    <line class="row-line" x1="42" y1="273" x2="1146" y2="273"/>
    <line class="row-line" x1="42" y1="296" x2="1146" y2="296"/>
    <line class="row-line" x1="42" y1="319" x2="1146" y2="319"/>
    <line class="row-line" x1="42" y1="342" x2="1146" y2="342"/>
    <line class="row-line" x1="42" y1="365" x2="1146" y2="365"/>
    <line class="row-line" x1="42" y1="388" x2="1146" y2="388"/>
    <line class="row-line" x1="42" y1="411" x2="1146" y2="411"/>
    <line class="row-line" x1="42" y1="434" x2="1146" y2="434"/>
    <line class="row-line" x1="42" y1="457" x2="1146" y2="457"/>
    <line class="row-line" x1="42" y1="480" x2="1146" y2="480"/>
    <line class="row-line" x1="42" y1="503" x2="1146" y2="503"/>
    <line class="row-line" x1="42" y1="526" x2="1146" y2="526"/>

    <text class="label" x="42" y="268">Zyklus 1</text><rect class="cycle" x="120" y="255" width="78" height="12" rx="6"/><rect class="period" x="120" y="255" width="11" height="12" rx="6"/><text class="value" x="1110" y="268" text-anchor="end">26 Tage</text>
    <text class="label" x="42" y="291">Zyklus 2</text><rect class="cycle" x="194" y="278" width="84" height="12" rx="6"/><rect class="period" x="194" y="278" width="15" height="12" rx="6"/><text class="value" x="1110" y="291" text-anchor="end">28 Tage</text>
    <text class="label" x="42" y="314">Zyklus 3</text><rect class="cycle" x="270" y="301" width="90" height="12" rx="6"/><rect class="period" x="270" y="301" width="18" height="12" rx="6"/><circle class="spotting" cx="303" cy="307" r="5"/><text class="value" x="1110" y="314" text-anchor="end">30 Tage</text>
    <text class="label" x="42" y="337">Zyklus 4</text><rect class="cycle" x="348" y="324" width="81" height="12" rx="6"/><rect class="period" x="348" y="324" width="11" height="12" rx="6"/><text class="value" x="1110" y="337" text-anchor="end">27 Tage</text>
    <text class="label" x="42" y="360">Zyklus 5</text><rect class="cycle" x="421" y="347" width="87" height="12" rx="6"/><rect class="period" x="421" y="347" width="15" height="12" rx="6"/><text class="value" x="1110" y="360" text-anchor="end">29 Tage</text>
    <text class="label" x="42" y="383">Zyklus 6</text><rect class="cycle" x="501" y="370" width="84" height="12" rx="6"/><rect class="period" x="501" y="370" width="18" height="12" rx="6"/><circle class="spotting" cx="532" cy="376" r="5"/><text class="value" x="1110" y="383" text-anchor="end">28 Tage</text>
    <text class="label" x="42" y="406">Zyklus 7</text><rect class="cycle" x="576" y="393" width="78" height="12" rx="6"/><rect class="period" x="576" y="393" width="11" height="12" rx="6"/><text class="value" x="1110" y="406" text-anchor="end">26 Tage</text>
    <text class="label" x="42" y="429">Zyklus 8</text><rect class="cycle" x="650" y="416" width="90" height="12" rx="6"/><rect class="period" x="650" y="416" width="15" height="12" rx="6"/><text class="value" x="1110" y="429" text-anchor="end">30 Tage</text>
    <text class="label" x="42" y="452">Zyklus 9</text><rect class="cycle" x="727" y="439" width="81" height="12" rx="6"/><rect class="period" x="727" y="439" width="18" height="12" rx="6"/><circle class="spotting" cx="760" cy="445" r="5"/><text class="value" x="1110" y="452" text-anchor="end">27 Tage</text>
    <text class="label" x="42" y="475">Zyklus 10</text><rect class="cycle" x="804" y="462" width="87" height="12" rx="6"/><rect class="period" x="804" y="462" width="11" height="12" rx="6"/><text class="value" x="1110" y="475" text-anchor="end">29 Tage</text>
    <text class="label" x="42" y="498">Zyklus 11</text><rect class="cycle" x="889" y="485" width="84" height="12" rx="6"/><rect class="period" x="889" y="485" width="15" height="12" rx="6"/><text class="value" x="1110" y="498" text-anchor="end">28 Tage</text>
    <text class="label" x="42" y="521">Zyklus 12</text><rect class="cycle" x="973" y="508" width="93" height="12" rx="6"/><rect class="period" x="973" y="508" width="11" height="12" rx="6"/><text class="value" x="1110" y="521" text-anchor="end">31 Tage</text>
  </g>

  <g aria-label="Legende">
    <rect class="period" x="42" y="570" width="18" height="12" rx="6"/><text class="legend" x="68" y="580">Blutungstage</text>
    <rect class="cycle" x="170" y="570" width="18" height="12" rx="6"/><text class="legend" x="196" y="580">Zyklusverlauf</text>
    <circle class="spotting" cx="312" cy="576" r="5"/><text class="legend" x="326" y="580">Schmierblutung</text>
    <text class="note" x="42" y="615">Hinweis: Die Werte sind erfundene Demo-Daten und keine medizinische Prognose.</text>
  </g>
</svg>
